receivers:
- name: 'autohealing-agent'
  webhook_configs:
  - url: 'http://autohealing-agent-svc.default.svc.cluster.local:8080/webhook'apiVersion: v1
kind: ServiceAccount
metadata:
  name: autohealing-agent-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: autohealing-agent-role
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: autohealing-agent-rolebinding
subjects:
- kind: ServiceAccount
  name: autohealing-agent-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: autohealing-agent-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autohealing-agent
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autohealing-agent
  template:
    metadata:
      labels:
        app: autohealing-agent
    spec:
      serviceAccountName: autohealing-agent-sa # Grants the pod rights to manage K8s resources
      containers:
      - name: autohealing-agent
        image: devops-autohealing-agent:latest # We will build this locally
        imagePullPolicy: Never # Forces Kubernetes to use the local docker image
        ports:
        - containerPort: 8080
        env:
        # If Ollama is running on your host machine, `localhost` inside the pod won't work.
        # - host.docker.internal works for Docker Desktop.
        # - host.minikube.internal works for Minikube.
        # - 10.0.2.2 usually works for kind/VirtualBox. 
        # Update this to your host machine's IP where Ollama is running if needed!
        - name: OLLAMA_URL
          value: "http://host.docker.internal:11434/api/generate"
        - name: LLM_MODEL
          value: "llama3:latest"
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: autohealing-agent-svc
  namespace: default
spec:
  selector:
    app: autohealing-agent
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP # Internal K8s service, Prometheus can reach it via http://autohealing-agent-svc.default.svc.cluster.local:8080/webhook
